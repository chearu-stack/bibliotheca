name: Auto-update Library

on:
  schedule:
    - cron: '0 3,15 * * *'
  push:
    paths:
      - 'scripts/parse_archive.py'
      - 'scripts/build_site.py'
      - '.github/workflows/update_library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Refresh archive content
        run: python scripts/parse_archive.py

      - name: Run build script
        run: python scripts/build_site.py

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ data/ site/
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "chore: automatically update archive"
            git push
          fi
