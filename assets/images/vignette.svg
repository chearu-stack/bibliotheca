<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 20" width="100%" height="20" fill="none" role="img" aria-label="Декоративный разделитель">
  <!-- Left line with a gentle fade -->
  <path d="M 40 10 L 160 10" stroke="#C5A059" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <path d="M 110 10 L 175 10" stroke="#C5A059" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Symmetric central element: diamond and curls -->
  <path d="M 175 10 C 185 10, 188 4, 192 10 C 188 16, 185 10, 175 10 Z" fill="#C5A059"/>
  <polygon points="200,3 207,10 200,17 193,10" fill="#C5A059"/>
  <path d="M 225 10 C 215 10, 212 4, 208 10 C 212 16, 215 10, 225 10 Z" fill="#C5A059"/>

  <!-- Right line -->
  <path d="M 225 10 L 290 10" stroke="#C5A059" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 240 10 L 360 10" stroke="#C5A059" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
